<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

<script>
/* 日本語向け検索の差し替え。 */
/* just-the-docs 既定の lunr は空白区切りでトークン化するため、分かち書きしない */
/* 日本語では文がまるごと1トークンになり、部分文字列（例:「高取城」）が一切ヒットしない。 */
/* ここでは同じ検索インデックス（search-data.json）に対して単純な部分一致を行う。 */
/* 見た目はテーマ既定のまま（クラス名を踏襲）。 */
(function () {
  var BASE = '{{ site.baseurl }}';
  var MAX_RESULTS = 12;
  var PREVIEW_PAD = 40;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* 検索インデックス由来のURLをそのまま href に入れない。
     Jekyll が生成する相対パス以外は受け付けず、スキーム付きURLは弾く。 */
  function safeUrl(rel) {
    var r = String(rel || '');
    if (r.charAt(0) !== '/' || r.charAt(1) === '/') return BASE + '/';
    return BASE + r;
  }

  /* 一致箇所の前後を切り出して、一致部分を強調した HTML を返す */
  function preview(text, q) {
    var i = text.toLowerCase().indexOf(q);
    if (i < 0) return '';
    var s = Math.max(0, i - PREVIEW_PAD);
    var e = Math.min(text.length, i + q.length + PREVIEW_PAD);
    return (s > 0 ? '…' : '') + esc(text.slice(s, i)) +
      '<span class="search-result-highlight">' + esc(text.slice(i, i + q.length)) + '</span>' +
      esc(text.slice(i + q.length, e)) + (e < text.length ? '…' : '');
  }

  window.addEventListener('load', function () {
    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');
    if (!input || !results) return;

    /* テーマ既定の lunr ハンドラを外すため、入力欄を差し替える */
    var fresh = input.cloneNode(true);
    input.parentNode.replaceChild(fresh, input);
    input = fresh;

    var docs = null;
    var loading = false;

    function load(cb) {
      if (docs) return cb();
      if (loading) return;
      loading = true;
      fetch(BASE + '/assets/js/search-data.json')
        .then(function (r) { return r.json(); })
        .then(function (json) {
          docs = Object.keys(json).map(function (k) { return json[k]; });
          loading = false;
          cb();
        })
        .catch(function () { loading = false; });
    }

    function search(q) {
      var lq = q.toLowerCase();
      var hits = [];
      for (var i = 0; i < docs.length; i++) {
        var d = docs[i];
        var inDoc = (d.doc || '').toLowerCase().indexOf(lq) >= 0;
        var inTitle = (d.title || '').toLowerCase().indexOf(lq) >= 0;
        var inBody = (d.content || '').toLowerCase().indexOf(lq) >= 0;
        if (!inDoc && !inTitle && !inBody) continue;
        /* ページ名一致 > 見出し一致 > 本文一致 */
        hits.push({ d: d, rank: inDoc ? 0 : (inTitle ? 1 : 2) });
      }
      hits.sort(function (a, b) { return a.rank - b.rank; });
      return hits.slice(0, MAX_RESULTS);
    }

    function render(q, hits) {
      if (!hits.length) {
        results.innerHTML = '';
        document.body.classList.add('search-no-result');
        return;
      }
      document.body.classList.remove('search-no-result');
      var html = '<ul class="search-results-list">';
      hits.forEach(function (h) {
        var d = h.d;
        var section = (d.title && d.title !== d.doc)
          ? '<span class="search-result-section">' + esc(d.title) + '</span>' : '';
        var p = preview(d.content || '', q.toLowerCase());
        html += '<li class="search-results-list-item">' +
          '<a href="' + esc(safeUrl(d.relUrl)) + '" class="search-result">' +
          '<div class="search-result-title">' +
          '<span class="search-result-doc"><svg viewBox="0 0 24 24" class="search-result-icon">' +
          '<use xlink:href="#svg-doc"></use></svg>' +
          '<span class="search-result-doc-title">' + esc(d.doc || '') + '</span></span>' +
          section + '</div>' +
          (p ? '<div class="search-result-previews"><div class="search-result-preview">' + p + '</div></div>' : '') +
          '</a></li>';
      });
      results.innerHTML = html + '</ul>';
    }

    function run() {
      var q = input.value.trim();
      if (!q) {
        results.innerHTML = '';
        document.body.classList.remove('search-active', 'search-no-result');
        return;
      }
      document.body.classList.add('search-active');
      load(function () { render(q, search(q)); });
    }

    input.addEventListener('input', run);
    input.addEventListener('focus', function () { if (input.value.trim()) run(); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        input.value = '';
        run();
        input.blur();
      }
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.search')) {
        document.body.classList.remove('search-active', 'search-no-result');
      }
    });
  });
})();
</script>
